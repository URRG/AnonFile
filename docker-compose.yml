name: anonflow
# Synthetic-only, single-process development. No production service is provided.
services:
  api:
    build:
      context: ./services/api
    environment:
      ANONFLOW_ENV: ${ANONFLOW_ENV:-development}
      ANONFLOW_DEV_PRINCIPALS: ${ANONFLOW_DEV_PRINCIPALS:-}
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
  web-test:
    profiles: [test]
    build:
      context: ./apps/web
      target: test
