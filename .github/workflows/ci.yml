name: Synthetic foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anonflow_test
          POSTGRES_USER: anonflow
          POSTGRES_PASSWORD: anonflow_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonflow -d anonflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANONFLOW_POSTGRES_TEST_DSN: postgresql://anonflow:anonflow_test_only@localhost:5432/anonflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/api
  openbao-transit-integration:
    # This provisions an in-memory OpenBao dev server only for this CI job.
    # OpenBao dev mode is never a production deployment mechanism.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Verify Transit Ed25519 against a TLS-enabled OpenBao dev server
        env:
          # Official OpenBao image, pinned to the linux/amd64 2.5.5 manifest.
          OPENBAO_IMAGE: openbao/openbao:2.5.5@sha256:e59b4c73cfce6875363d25548222819433c6ce0af9c6d3ec9ede220e905723f9
        run: bash services/api/scripts/run-openbao-transit-integration.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run test:deployment
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test:integration
        working-directory: apps/web
