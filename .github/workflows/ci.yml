name: Synthetic foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: anonflow_test
          POSTGRES_USER: anonflow
          POSTGRES_PASSWORD: anonflow_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonflow -d anonflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANONFLOW_POSTGRES_TEST_DSN: postgresql://anonflow:anonflow_test_only@localhost:5432/anonflow_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/api
  openbao-transit-integration:
    # This provisions an in-memory OpenBao dev server only for this CI job.
    # OpenBao dev mode is never a production deployment mechanism.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Verify Transit Ed25519 against a TLS-enabled OpenBao dev server
        env:
          # Official OpenBao image, pinned to the linux/amd64 2.5.5 manifest.
          OPENBAO_IMAGE: openbao/openbao:2.5.5@sha256:e59b4c73cfce6875363d25548222819433c6ce0af9c6d3ec9ede220e905723f9
        run: bash services/api/scripts/run-openbao-transit-integration.sh
  s3-ciphertext-integration:
    # CI-only: one disposable S3-compatible instance with a generated, verified TLS
    # certificate. This proves only the pinned image/configuration below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Verify ciphertext transport against pinned S3-compatible storage
        run: bash services/api/scripts/run-s3-ciphertext-integration.sh
  worker-encrypted-object-path-integration:
    # CI-only: compose the existing bounded worker adapters against disposable
    # TLS OpenBao and S3-compatible servers. This is not a production deployment test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - name: Verify encrypted worker object path against OpenBao and S3 over TLS
        env:
          OPENBAO_IMAGE: openbao/openbao:2.5.5@sha256:e59b4c73cfce6875363d25548222819433c6ce0af9c6d3ec9ede220e905723f9
          S3_INTEGRATION_IMAGE: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        run: bash services/api/scripts/run-worker-encrypted-objects-integration.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run test:deployment
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test:integration
        working-directory: apps/web
  dependency-audit:
    # Advisory scans cover the dependency versions resolved in this CI run.
    # They do not replace a lockfile, SBOM review, or native-library audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit installed Python packages
        run: python -m pip_audit --strict --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - name: Audit runtime web dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
  container-build:
    # This tests the synthetic development images only. No production release
    # or media-parser isolation follows from a successful image build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate development Compose configuration
        run: docker compose config --quiet
      - name: Build API and web development images
        run: docker compose build api web
