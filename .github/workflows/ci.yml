name: Synthetic foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anonflow_test
          POSTGRES_USER: anonflow
          POSTGRES_PASSWORD: anonflow_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anonflow -d anonflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANONFLOW_POSTGRES_TEST_DSN: postgresql://anonflow:anonflow_test_only@localhost:5432/anonflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: services/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run test:deployment
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test:integration
        working-directory: apps/web
